<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAZAR · Scenarios</title>
<link rel="icon" href="/static/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/app.css?v=28">
<script src="/static/i18n.js?v=28"></script>
</head>
<body class="sc-page">
<div class="backdrop" aria-hidden="true"></div>

<header class="top">
  <div class="brand">
    <img src="/static/logo.png" alt="" width="34" height="34">
    <div><strong>NAZAR</strong> <span class="brand-sub" data-i18n="sc_brand"></span></div>
  </div>
  <!-- The same places to go as on the assistant's page; Company and Add people open its tabs. -->
  <nav class="tabs">
    <a class="tab-link" href="/" data-i18n="tab_ask"></a>
    <a class="tab-link" href="/#company" data-i18n="tab_company"></a>
    <a class="tab-link" href="/#people" data-i18n="tab_import"></a>
    <a class="tab-link on" href="/scenarios" data-i18n="tab_scenarios"></a>
  </nav>
  <div class="prefs">
    <div class="seg lang" id="lang-seg" role="radiogroup" data-i18n-aria="language">
      <button type="button" data-lang="en" role="radio">EN</button>
      <button type="button" data-lang="ru" role="radio">RU</button>
      <button type="button" data-lang="uz" role="radio">UZ</button>
    </div>
    <button type="button" class="theme" id="theme-toggle">☾</button>
  </div>
</header>

<main>
  <!-- /scenarios: the gallery — one card per problem, each opens its own page. -->
  <section class="hero sc-hero" id="gallery" hidden>
    <h1><span data-i18n="sc_h1"></span> <span class="grad" data-i18n="sc_h1_grad"></span></h1>
    <p class="lead" data-i18n="sc_lead"></p>
    <div class="sc-gallery" id="sc-cards"></div>
  </section>

  <!-- /scenarios/<name>: why it matters, the three steps, then the scene itself. -->
  <section class="sc-intro" id="scene-intro" hidden>
    <a class="sc-back" href="/scenarios" data-i18n="sc_all"></a>
    <h1 id="scene-title"></h1>
    <div class="sc-why">
      <p><b data-i18n="sc_why_label"></b> <span id="scene-why"></span></p>
      <p><b data-i18n="sc_does_label"></b> <span id="scene-does"></span></p>
    </div>
    <ol class="sc-steps" id="scene-steps"></ol>
  </section>

  <section class="sc-part" id="explain">
    <header class="sc-head"><span class="sc-step">1</span>
      <div><h2 data-i18n="sc_t1"></h2><p data-i18n="sc_d1"></p></div></header>
    <div class="sc-scenes" id="explain-scenes"></div>
    <div class="sc-two">
      <div class="sc-side sc-pane">
        <h3 class="sc-label" data-i18n="sc_owner"></h3>
        <div id="explain-card"></div>
        <div class="sc-actions">
          <label class="sc-select"><span data-i18n="sc_ask_in"></span>
            <select id="explain-lang"><option value="en">English</option><option value="uz">O'zbek</option><option value="ru">Русский</option></select>
          </label>
          <button class="primary" id="explain-ask" type="button"></button>
        </div>
        <div class="sc-result" id="explain-result"></div>
      </div>
      <div class="sc-side sc-phone">
        <h3 class="sc-label" data-i18n="sc_phone"></h3>
        <div class="sc-chat" id="explain-chat"></div>
        <p class="sc-label sc-small" data-i18n="sc_answer_as"></p>
        <div class="sc-templates" id="explain-templates"></div>
        <form class="sc-reply" id="explain-form">
          <input id="explain-text" type="text" maxlength="1000" data-i18n-placeholder="sc_own_answer">
          <button class="primary" type="submit" data-i18n="sc_send"></button>
        </form>
      </div>
    </div>
  </section>

  <section class="sc-part" id="roster">
    <header class="sc-head"><span class="sc-step">2</span>
      <div><h2 data-i18n="sc_t2"></h2><p data-i18n="sc_d2"></p></div></header>
    <div class="sc-scenes" id="roster-scenes"></div>
    <div class="sc-two">
      <div class="sc-side"><img class="sc-picture sc-contain" id="roster-picture" alt=""></div>
      <div class="sc-side sc-pane">
        <div class="sc-actions">
          <button class="primary" id="roster-read" type="button" data-i18n="sc_read"></button>
          <label class="sc-file"><span data-i18n="sc_own_picture"></span><input type="file" id="roster-file" accept="image/*" hidden></label>
        </div>
        <div class="sc-result" id="roster-result"></div>
      </div>
    </div>
  </section>

  <section class="sc-part" id="headcount">
    <header class="sc-head"><span class="sc-step">3</span>
      <div><h2 data-i18n="sc_t3"></h2><p data-i18n="sc_d3"></p></div></header>
    <div class="sc-scenes" id="headcount-scenes"></div>
    <div class="sc-two">
      <div class="sc-side"><img class="sc-picture" id="headcount-picture" alt=""></div>
      <div class="sc-side sc-pane">
        <div id="headcount-roster"></div>
        <div class="sc-actions">
          <button class="primary" id="headcount-count" type="button" data-i18n="sc_count"></button>
          <label class="sc-file"><span data-i18n="sc_own_photo"></span><input type="file" id="headcount-file" accept="image/*" hidden></label>
        </div>
        <div class="sc-result" id="headcount-result"></div>
      </div>
    </div>
  </section>

  <section class="sc-part" id="place">
    <header class="sc-head"><span class="sc-step">4</span>
      <div><h2 data-i18n="sc_t4"></h2><p data-i18n="sc_d4"></p></div></header>
    <div class="sc-scenes" id="place-scenes"></div>
    <div class="sc-pane">
      <h3 class="sc-label" data-i18n="sc_earlier"></h3>
      <div class="sc-thumbs" id="place-references"></div>
      <h3 class="sc-label" data-i18n="sc_new"></h3>
      <div class="sc-thumbs" id="place-candidates"></div>
      <div class="sc-actions">
        <label class="sc-file"><span data-i18n="sc_own_photo"></span><input type="file" id="place-file" accept="image/*" hidden></label>
      </div>
      <div class="sc-result" id="place-result"></div>
    </div>
  </section>
</main>

<p class="sc-nazar" id="scene-nazar" hidden></p>
<footer class="foot" data-i18n="sc_footer"></footer>
<script src="/static/scenarios.js?v=28"></script>
</body>
</html>
