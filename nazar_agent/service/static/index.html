<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAZAR · Assistant</title>
<link rel="icon" href="/static/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/app.css?v=20">
<script src="/static/i18n.js?v=20"></script>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>

<header class="top">
  <div class="brand">
    <img src="/static/logo.png" alt="" width="34" height="34">
    <div><strong>NAZAR</strong> <span class="brand-sub" data-i18n="brand_sub">Помощник</span></div>
  </div>
  <div class="team-pill" id="team-pill"><span class="dot"></span><span id="team-status" data-i18n="team_idle">Команда на месте</span></div>
  <div id="who" class="who"></div>
  <div class="prefs">
    <div class="seg lang" id="lang-seg" role="radiogroup" data-i18n-aria="language">
      <button type="button" data-lang="ru" role="radio" aria-checked="false">RU</button>
      <button type="button" data-lang="uz" role="radio" aria-checked="false">UZ</button>
      <button type="button" data-lang="en" role="radio" aria-checked="false">EN</button>
    </div>
    <button type="button" class="theme" id="theme-toggle">☾</button>
  </div>
</header>

<div id="sign-in-notice" class="notice" hidden></div>

<main>
  <section class="hero">
    <h1><span data-i18n="hero_title">Команда ИИ-агентов проверяет учёт.</span> <span class="grad" data-i18n="hero_grad">Решаете вы.</span></h1>
    <p class="lead" data-i18n="hero_lead"></p>
    <ul class="powers">
      <li><b data-i18n="p1_t"></b><span data-i18n="p1"></span></li>
      <li><b data-i18n="p2_t"></b><span data-i18n="p2"></span></li>
      <li><b data-i18n="p3_t"></b><span data-i18n="p3"></span></li>
      <li><b data-i18n="p4_t"></b><span data-i18n="p4"></span></li>
    </ul>
    <p class="demo-line" id="demo-line" hidden data-i18n="hero_demo"></p>
    <div class="models">
      <span class="chip"><i class="m-a"></i><span data-i18n="chip_analysts"></span></span>
      <span class="chip"><i class="m-o"></i><span data-i18n="chip_open"></span></span>
      <span class="chip"><i class="m-c"></i><span data-i18n="chip_code"></span></span>
    </div>
  </section>

  <nav class="tabs" role="tablist">
    <button type="button" id="tab-ask-button" role="tab" aria-selected="true" data-i18n="tab_ask"></button>
    <button type="button" id="tab-import-button" role="tab" aria-selected="false" data-i18n="tab_import"></button>
    <button type="button" id="tab-company-button" role="tab" aria-selected="false" data-i18n="tab_company"></button>
  </nav>

  <section id="tab-ask">
    <section class="try" aria-labelledby="try-title">
      <h2 id="try-title" data-i18n="try_title"></h2>
      <p class="muted try-note" data-i18n="try_note"></p>
      <div class="try-grid" id="try-list"></div>
    </section>
    <form class="ask glass" id="ask">
      <textarea id="question" maxlength="500" required data-i18n-placeholder="question_placeholder"></textarea>
      <div class="row">
        <div class="seg" id="analyst-seg" role="radiogroup" hidden data-i18n-aria="analyst_aria">
          <button type="button" data-value="auto" aria-checked="true" role="radio" data-i18n="seg_auto"></button>
          <button type="button" data-value="attendance" aria-checked="false" role="radio" data-i18n="seg_attendance"></button>
          <button type="button" data-value="timesheet" aria-checked="false" role="radio" data-i18n="seg_timesheet"></button>
        </div>
        <input type="hidden" id="actor" value="Owner">
        <button type="button" class="ghost" id="new-dialog" hidden data-i18n="new_dialog"></button>
        <button type="button" class="mic" id="mic" hidden data-i18n-title="mic" data-i18n-aria="mic">🎤</button>
        <button class="primary" id="send" type="submit"><span data-i18n="send"></span></button>
      </div>
      <div class="status" id="status"></div>
    </form>

    <section id="run" class="run" hidden aria-live="polite">
      <div class="run-frame">
        <div class="run-head">
          <span class="orb" id="run-orb"></span>
          <div class="run-titles">
            <b id="run-title"></b>
            <span id="run-question" class="muted"></span>
          </div>
          <span class="timer" id="run-timer"></span>
        </div>
        <div class="scan" id="run-scan"></div>
        <div class="run-body">
          <ol class="roster" id="roster">
            <li data-agent="dispatcher"><span class="node"></span><div><b data-i18n="dispatcher"></b><small>Muse Spark 1.3</small></div></li>
            <li data-agent="analyst"><span class="node"></span><div><b id="analyst-name" data-i18n="analyst"></b><small>Muse Spark 1.3</small></div></li>
            <li data-agent="photos"><span class="node"></span><div><b data-i18n="photo_inspector"></b><small>Muse Spark Open</small></div></li>
            <li data-agent="checker"><span class="node"></span><div><b data-i18n="fact_checker"></b><small data-i18n="code"></small></div></li>
            <li data-agent="skeptic"><span class="node"></span><div><b data-i18n="skeptic"></b><small>Muse Spark Open</small></div></li>
            <li data-agent="writer"><span class="node"></span><div><b data-i18n="writer"></b><small>Muse Spark 1.3</small></div></li>
            <li data-agent="validator"><span class="node"></span><div><b data-i18n="validator"></b><small data-i18n="code_nazar"></small></div></li>
          </ol>
          <ol class="feed" id="feed"></ol>
        </div>
      </div>
    </section>

    <div id="answer"></div>
    <section id="history" class="history"></section>
  </section>

  <section id="tab-import" hidden>
    <form class="ask glass" id="import-form">
      <div class="samples" id="import-samples"></div>
      <textarea id="import-text" maxlength="20000" data-i18n-placeholder="import_placeholder"></textarea>
      <div id="import-zone"></div>
      <div class="row">
        <span id="import-chosen"></span>
        <button class="primary" id="import-read" type="submit"><span data-i18n="import_read"></span></button>
      </div>
      <div class="status" id="import-status"></div>
    </form>
    <div id="import-review"></div>
    <section class="panel glass" id="waiting-section">
      <div class="row"><h2 data-i18n="waiting_title"></h2>
        <button type="button" id="start-shooting" data-i18n="start_shooting"></button>
        <button type="button" id="refresh-waiting" data-i18n="refresh"></button></div>
      <p class="muted" data-i18n="waiting_note"></p>
      <div id="shooting"></div>
      <ul id="waiting" class="plain"></ul>
    </section>
  </section>

  <section id="tab-company" hidden>
    <div class="row company-head">
      <p class="muted" id="company-note" data-i18n="company_note"></p>
      <span class="muted" id="company-asof"></span>
      <button type="button" id="refresh-company" data-i18n="refresh"></button>
    </div>
    <div id="company"></div>
  </section>

  <details class="panel glass fold" id="usage-section">
    <summary><h2 data-i18n="usage_title"></h2></summary>
    <div class="row"><p class="muted" data-i18n="usage_note"></p><button type="button" id="refresh-usage" data-i18n="refresh"></button></div>
    <div id="usage" class="usage"></div>
  </details>

  <details class="panel glass fold" id="audit-section">
    <summary><h2 data-i18n="audit_title"></h2></summary>
    <div class="row"><p class="muted" id="decisions"></p><button type="button" id="refresh-audit" data-i18n="refresh"></button></div>
    <ol id="audit" class="timeline"></ol>
  </details>
</main>

<footer class="foot" data-i18n="footer"></footer>
<script src="/static/media.js?v=20"></script>
<script src="/static/app.js?v=20"></script>
<script src="/static/people.js?v=20"></script>
<script src="/static/setup.js?v=20"></script>
<script src="/static/company.js?v=20"></script>
</body>
</html>
