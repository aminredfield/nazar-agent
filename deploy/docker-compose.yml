# The agent next to a NAZAR production deployment, on NAZAR's own Docker network,
# so the existing Caddy proxies the window. Usage (from this folder, with
# deploy/.env filled in):
#
#   docker compose -p nazar-agent up -d --build
#
# NAZAR_NETWORK is the network of NAZAR's compose project, e.g.
# faceid-startup-mvp_default (docker network ls).

services:
  nazar-agent:
    build:
      context: ..
    env_file:
      - .env
    environment:
      # NAZAR's public address, not backend:8000 inside the network: production
      # NAZAR accepts only its public host names, and its session cookies are
      # Secure, so they travel over HTTPS only.
      NAZAR_BASE_URL: ${NAZAR_PUBLIC_API:-https://nazarhr.uz/api}
      REQUIRE_SIGN_IN: "true"
      COOKIE_SECURE: "true"
    volumes:
      - agent_data:/data
    networks:
      - nazar
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  agent_data:

networks:
  nazar:
    name: ${NAZAR_NETWORK:-faceid-startup-mvp_default}
    external: true
